name: Deploy Prod → Servidor de Produção

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (static export)
        run: npm run build

      - name: Deploy to Production Server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PROD_FTP_SERVER }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          # Ajuste 'server-dir' conforme o caminho da raiz do seu domínio
          # Hospedagens comuns usam:
          # - cPanel: /public_html/ ou /public_html/seudominio.com/
          # - Plesk: /httpdocs/
          # - DirectAdmin: /domains/seudominio.com/public_html/
          dangerous-clean-slate: false
          # CUIDADO: se true, apaga tudo no servidor antes do upload!
